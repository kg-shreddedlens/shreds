<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex,nofollow" />
<title>Shredded Lens Shreds</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;600&display=swap" rel="stylesheet" />
<style>
  :root { color-scheme: light; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f6f4ef; color: #111; font-family: "DM Sans", sans-serif; }
  main { width: min(520px, calc(100% - 40px)); }
  p.brand { margin: 0 0 8px; font-family: "Bebas Neue", sans-serif; letter-spacing: .08em; font-size: 22px; }
  p.brand span { color: #9d1c1c; }
  h1 { margin: 0 0 10px; font-family: "Bebas Neue", sans-serif; font-size: 72px; letter-spacing: .04em; line-height: .9; }
  p.lede { margin: 0 0 22px; color: #444; }
  a.card { display: block; border: 3px solid #111; background: #fff; padding: 16px 18px; text-decoration: none; color: inherit; }
  a.card strong { display: block; font-family: "Bebas Neue", sans-serif; font-size: 32px; letter-spacing: .04em; }
  a.card span { color: #444; font-size: 14px; }
</style>
</head>
<body>
<main>
  <p class="brand">SLS <span>SHREDDED LENS</span></p>
  <h1>SHREDS</h1>
  <p class="lede">Password-protected shreds. Use the link and password from your Shredded Lens contact.</p>
</main>
</body>
</html>
