            .staticrypt-html,

            }

                position: relative;
                min-height: 100%;
                height: 100%;
                margin: 0;
                background: #000;
                color: #fff;
                font-family: "Open Sans", Arial, sans-serif;
                overflow: hidden;
            }
            .sls-video {
                position: absolute;
                inset: 0;
                width: 100%;
                height: 100%;
                object-fit: cover;
                object-position: center 28%;
                background: #000;
            }
            .sls-shade {
                position: absolute;
                left: 0;
                right: 0;
                bottom: 0;
                height: 46%;
                background: linear-gradient(to top, rgba(0, 0, 0, 0.94) 18%, rgba(0, 0, 0, 0.55) 58%, rgba(0, 0, 0, 0));
                pointer-events: none;
            }
            .sls-top {
                position: absolute;
                top: 0;
                left: 0;
                right: 0;
                z-index: 2;
                background: #000;
                color: #c42525;
                text-align: center;
                font-weight: 600;
                font-size: 14px;
                letter-spacing: 0.02em;
                padding: 16px 20px;
            }
            .staticrypt-page {
                position: absolute;
                left: 0;
                right: 0;
                bottom: 0;
                z-index: 2;
                box-sizing: border-box;
                width: min(440px, calc(100% - 32px));
                margin: 0 auto 28px;
                padding: 0;
                text-align: center;
            }
            .sls-message {
                margin: 0 0 6px;
                color: #c42525;
                font-size: clamp(28px, 6vw, 42px);
                font-weight: 700;
                letter-spacing: 0.01em;
                line-height: 1.05;
            }
            .staticrypt-title {
                margin: 0 0 10px;
                color: #fff;
                font-size: 13px;
                font-weight: 600;
                letter-spacing: 0.16em;
                text-transform: uppercase;
            }
            .staticrypt-instructions {
                margin: 0 0 18px;
                color: rgba(255, 255, 255, 0.78);
                font-size: 13px;
                line-height: 1.45;
            }
            .staticrypt-instructions p {
                margin: 0;
            }
            .staticrypt-form {
                margin: 0;
            }
            .staticrypt-password-container {
                position: relative;
                background: transparent;
                border-bottom: 1px solid rgba(255, 255, 255, 0.55);
                margin: 0 0 16px;
            }
            .staticrypt-form input[type="password"],
            .staticrypt-form input[type="text"] {
                width: 100%;
                box-sizing: border-box;
                background: transparent;
                border: 0;
                color: #fff;
                font: 16px "Open Sans", Arial, sans-serif;
                outline: 0;
                padding: 12px 40px 12px 2px;
            }
            .staticrypt-form input::placeholder {
                color: rgba(255, 255, 255, 0.55);
            }
            .staticrypt-toggle-password-visibility {
                cursor: pointer;
                height: 18px;
                width: 18px;
                padding: 12px;
                position: absolute;
                right: 0;
                top: 50%;
                transform: translateY(-50%);
                filter: invert(1);
                opacity: 0.85;
            }
            .staticrypt-decrypt-button {
                width: 100%;
                border: 0;
                background: #c42525;
                color: #fff;
                font: 600 14px "Open Sans", Arial, sans-serif;
                letter-spacing: 0.14em;
                text-transform: uppercase;
                padding: 14px 16px;
                cursor: pointer;
            }
            .staticrypt-decrypt-button:hover,
            .staticrypt-decrypt-button:focus {
                background: #a61e1e;
            }
            .staticrypt-remember {
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 8px;
                margin: 0 0 12px;
                color: #fff;
                font-size: 13px;
            }
            .hidden {
                display: none !important;
            }
            .staticrypt-spinner-container {
                height: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
                background: #000;
            }
            .staticrypt-spinner {
                width: 2rem;
                height: 2rem;
                border: 0.25em solid rgba(255, 255, 255, 0.35);
                border-right-color: transparent;
                border-radius: 50%;
                animation: spinner-border 0.75s linear infinite;
            }
            @keyframes spinner-border {
                100% {
                    transform: rotate(360deg);
                }
            }
            @media (prefers-reduced-motion: reduce) {
                .sls-video {
                    display: none;
                }
            }
