            .staticrypt-html,

                position: relative;
                min-height: 100%;
                height: 100%;
                margin: 0;
                background: #000;
                color: #fff;
                font-family: "Open Sans", Arial, sans-serif;
                overflow: hidden;
                display: grid;
                place-items: center;
            }
            .sls-video {
                position: absolute;
                inset: 0;
                width: 100%;
                height: 100%;
                object-fit: cover;
                object-position: center center;
                background: #000;
            }
            .staticrypt-page {
                position: relative;
                z-index: 2;
                box-sizing: border-box;
                width: min(420px, calc(100% - 40px));
                margin: 0;
                padding: 36px 32px 28px;
                text-align: center;
                background: rgba(8, 8, 8, 0.42);
                border: 1px solid rgba(255, 255, 255, 0.22);
                border-radius: 18px;
                backdrop-filter: blur(18px);
                -webkit-backdrop-filter: blur(18px);
                box-shadow: 0 18px 50px rgba(0, 0, 0, 0.28);
            }
            .sls-name {
                margin: 0 0 28px;
                color: #fff;
                font-family: "Open Sans", Arial, sans-serif;
                font-weight: 500;
                font-size: clamp(18px, 3.2vw, 26px);
                letter-spacing: 0.16em;
                line-height: 1.35;
                text-transform: uppercase;
            }
            .staticrypt-form {
                margin: 0;
            }
            .staticrypt-password-container {
                position: relative;
                background: transparent;
                border-bottom: 1px solid rgba(255, 255, 255, 0.55);
                margin: 0 0 16px;
            }
            .staticrypt-form input[type="password"],
            .staticrypt-form input[type="text"] {
                width: 100%;
                box-sizing: border-box;
                background: transparent !important;
                border: 0;
                color: #fff;
                -webkit-text-fill-color: #fff;
                font: 16px "Open Sans", Arial, sans-serif;
                outline: 0;
                padding: 12px 40px 12px 2px;
            }
            .staticrypt-form input:-webkit-autofill {
                -webkit-box-shadow: 0 0 0 1000px transparent inset;
                -webkit-text-fill-color: #fff;
                transition: background-color 9999s ease-out;
            }
            .staticrypt-form input::placeholder {
                color: rgba(255, 255, 255, 0.55);
            }
            .staticrypt-toggle-password-visibility {
                cursor: pointer;
                height: 18px;
                width: 18px;
                padding: 12px;
                position: absolute;
                right: 0;
                top: 50%;
                transform: translateY(-50%);
                filter: invert(1);
                opacity: 0.85;
            }
            .staticrypt-decrypt-button {
                width: 100%;
                border: 0;
                background: #c42525;
                color: #fff;
                font: 600 14px "Open Sans", Arial, sans-serif;
                letter-spacing: 0.14em;
                text-transform: uppercase;
                padding: 14px 16px;
                cursor: pointer;
            }
            .staticrypt-decrypt-button:hover,
            .staticrypt-decrypt-button:focus {
                background: #a61e1e;
            }
            .staticrypt-remember {
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 8px;
                margin: 0 0 12px;
                color: #fff;
                font-size: 13px;
            }
            .hidden {
                display: none !important;
            }
            .staticrypt-spinner-container {
                height: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
                background: #000;
            }
            .staticrypt-spinner {
                width: 2rem;
                height: 2rem;
                border: 0.25em solid rgba(255, 255, 255, 0.35);
                border-right-color: transparent;
                border-radius: 50%;
                animation: spinner-border 0.75s linear infinite;
            }
            @keyframes spinner-border {
                100% {
                    transform: rotate(360deg);
                }
            }

                if (passwordInput.type === "password") {
                    passwordInput.type = "text";
                    toggleIcon.src = imgSrcEyeOpened;
                    toggleIcon.alt = templateToggleAltHide;
                    toggleIcon.title = templateToggleAltHide;
                } else {
                    passwordInput.type = "password";
                    toggleIcon.src = imgSrcEyeClosed;
                    toggleIcon.alt = templateToggleAltShow;
                    toggleIcon.title = templateToggleAltShow;
                }
            });

            document.getElementById("staticrypt-form").addEventListener("submit", async function (e) {
                e.preventDefault();

                const password = document.getElementById("staticrypt-password").value,
                    isRememberChecked = true; // always remember across pages on this device

                const { isSuccessful } = await staticrypt.handleDecryptionOfPage(password, isRememberChecked);

                if (!isSuccessful) {
                    alert(templateError);
                }
            });
        </script>
    </body>
</html>
